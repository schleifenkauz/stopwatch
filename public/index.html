<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#111827">
	<title>Stopwatch</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			min-height: 100svh;
			margin: 0;
			padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
			display: grid;
			place-items: center;
			background: #111827;
			color: #f9fafb;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main { width: min(100%, 480px); text-align: center; }
		h1 { margin: 0 0 20px; color: #9ca3af; font-size: .9rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
		.readout { display: flex; align-items: center; justify-content: center; gap: 16px; }
		#value { min-height: 1.2em; overflow-wrap: anywhere; font-size: clamp(3rem, 18vw, 7rem); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
		.indicator { display: inline-block; width: 1.25em; text-align: center; font-size: 1.25rem; line-height: 1; }
		.indicator[hidden] { display: none; }
		#stopped { color: #ef826d; }
		#running-indicator { color: #8bd49a; }
	</style>
</head>
<body>
	<main aria-live="polite" aria-atomic="true">
		<h1>Stopwatch</h1>
		<div class="readout">
			<span id="value">00:00</span>
			<span class="indicator" id="stopped" role="img" aria-label="Stopped" title="Stopped">&#9632;</span>
			<span class="indicator" id="running-indicator" role="img" aria-label="Running" title="Running" hidden>&#9654;</span>
		</div>
	</main>
	<script>
		const value = document.getElementById('value');
		const stopped = document.getElementById('stopped');
		const runningIndicator = document.getElementById('running-indicator');
		const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
		const socket = new WebSocket(`${protocol}//${location.host}`);
		let running = false;
		socket.onmessage = ({ data }) => {
			if (data === 'start') {
				running = true;
				stopped.hidden = true;
				runningIndicator.hidden = false;
				return;
			}
			if (data === 'stop') {
				running = false;
				value.textContent = '00:00';
				stopped.hidden = false;
				runningIndicator.hidden = true;
				return;
			}
			const seconds = Number(data);
			if (!running || !Number.isInteger(seconds) || seconds < 0) return;
			const minutes = Math.floor(seconds / 60);
			const remainingSeconds = seconds % 60;
			value.textContent = `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
		};
	</script>
</body>
</html>
