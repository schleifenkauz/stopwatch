<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#111827">
	<title>Stopwatch</title>
	<link rel="stylesheet" href="/index.css">
</head>
<body>
	<main aria-live="polite" aria-atomic="true">
		<h1>Stopwatch</h1>
		<div class="readout">
			<span id="value">00:00</span>
			<span class="indicator" id="stopped" role="img" aria-label="Stopped" title="Stopped">&#9632;</span>
			<span class="indicator" id="running-indicator" role="img" aria-label="Running" title="Running" hidden>&#9654;</span>
		</div>
	</main>
	<script src="/index.js" defer></script>
</body>
</html>
